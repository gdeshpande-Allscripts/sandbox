# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - cdssandbox

on:
  push:
    branches:
      - sandbox_order
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '14.x'

      - name: Verify Node.js version
        run: |
          node --version
          npm --version

      - name: npm install, build, and test
        run: |
          npm install --legacy-peer-deps
          npm run build --if-present
      
      - name: Install production dependencies
        run: |
          rm -rf node_modules
          npm install --production --legacy-peer-deps

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            build/
            node_modules/
            server.js
            package.json
            web.config

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8C3FFFDE09164288820BC3E1AE1B4BF1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_41E612147D7D4016AAB5F672401F696D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A2F35177451C4C2BBDD08EB6E18B16D0 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'cdssandbox'
          slot-name: 'Production'
          package: .
          